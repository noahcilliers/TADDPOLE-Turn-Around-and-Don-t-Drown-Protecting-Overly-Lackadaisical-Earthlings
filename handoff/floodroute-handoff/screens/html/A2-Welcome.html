<script>
/* Minimal standalone runtime for FloodRoute design screens.

    nodes.forEach((n) => {
      if (n.nodeType === 3) { out.push(document.createTextNode(interp(n.data, scope))); return; }
      if (n.nodeType !== 1) return;

      if (tag === 'sc-if') {
        const m = (n.getAttribute('value') || '').match(PURE);
        if (m && lookup(m[1], scope)) build(Array.from(n.childNodes), scope, out);
        return;
      }
      if (tag === 'sc-for') {
        const m = (n.getAttribute('list') || '').match(PURE);
        const list = (m && lookup(m[1], scope)) || [];
        const as = n.getAttribute('as') || 'item';
        list.forEach((item, i) => { const sc = Object.create(scope); sc[as] = item; sc.$index = i; build(Array.from(n.childNodes), sc, out); });

      }
