/* Minimal standalone runtime for FloodRoute design screens.

   Reference only: the production app should be rebuilt in your own frontend stack. */
(function () {

  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;

    if (path === 'true') return true;

  }
  const interp = (s, scope) => s.replace(HOLE, (_, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); });

    nodes.forEach((n) => {
      if (n.nodeType === 3) { out.push(document.createTextNode(interp(n.data, scope))); return; }

        const m = (n.getAttribute('value') || '').match(PURE);
        if (m && lookup(m[1], scope)) build(Array.from(n.childNodes), scope, out);
        return;
      }
      if (tag === 'sc-for') {
        const m = (n.getAttribute('list') || '').match(PURE);
        const list = (m && lookup(m[1], scope)) || [];
        const as = n.getAttribute('as') || 'item';
        list.forEach((item, i) => { const sc = Object.create(scope); sc[as] = item; sc.$index = i; build(Array.from(n.childNodes), sc, out); });
        return;
      }

    });

    const old = Array.from(parent.childNodes);

      Array.from(o.attributes).forEach((a) => { if (!n.hasAttribute(a.name)) o.removeAttribute(a.name); });

  function render() { queued = false; morph(mount, build(Array.from(tpl.content.childNodes), inst.renderVals() || {}, [])); }
