<script>
/* Minimal standalone runtime for FloodRoute design screens.
   Renders the <template id="dc-tpl"> with values from Component.renderVals():
   {{path}} holes, <sc-if value>, <sc-for list as>, onClick/onChange handlers.
   Reference only: the production app should be rebuilt in your own frontend stack. */
(function () {
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); schedule(); }
    forceUpdate() { schedule(); }
  }
  window.DCLogic = DCLogic;
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const PURE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  function lookup(path, scope) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return parseFloat(path);
    let cur = scope;
    for (const part of path.split('.')) { if (cur == null) return undefined; cur = cur[part]; }
    return cur;
  }
  const interp = (s, scope) => s.replace(HOLE, (_, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); });
  const EVENTS = { onclick: 'click', onchange: 'input', oninput: 'input' };
  function build(nodes, scope, out) {
    nodes.forEach((n) => {
      if (n.nodeType === 3) { out.push(document.createTextNode(interp(n.data, scope))); return; }
      if (n.nodeType !== 1) return;
      const tag = n.localName.toLowerCase();
      if (tag === 'sc-if') {
        const m = (n.getAttribute('value') || '').match(PURE);
        if (m && lookup(m[1], scope)) build(Array.from(n.childNodes), scope, out);
        return;
      }
      if (tag === 'sc-for') {
        const m = (n.getAttribute('list') || '').match(PURE);
        const list = (m && lookup(m[1], scope)) || [];
        const as = n.getAttribute('as') || 'item';
        list.forEach((item, i) => { const sc = Object.create(scope); sc[as] = item; sc.$index = i; build(Array.from(n.childNodes), sc, out); });
        return;
      }
      const el = n.namespaceURI && n.namespaceURI !== 'http://www.w3.org/1999/xhtml' ? document.createElementNS(n.namespaceURI, n.localName) : document.createElement(n.localName);
      el.__h = {};
      Array.from(n.attributes).forEach((a) => {
        const name = a.name;
        if (name.startsWith('hint-')) return;
        const pm = a.value.match(PURE);
        if (EVENTS[name.toLowerCase()]) { if (pm) el.__h[EVENTS[name.toLowerCase()]] = lookup(pm[1], scope); return; }
        let v = pm ? lookup(pm[1], scope) : interp(a.value, scope);
        if (v === false || v == null) return;
        el.setAttribute(name, v === true ? '' : String(v));
      });
      const kids = [];
      build(Array.from((n.content || n).childNodes), scope, kids);
      kids.forEach((k) => el.appendChild(k));
      out.push(el);
    });
    return out;
  }
  function morph(parent, next) {
    const old = Array.from(parent.childNodes);
    next.forEach((n, i) => {
      const o = old[i];
      if (!o) { parent.appendChild(n); return; }
      if (o.nodeType !== n.nodeType || o.nodeName !== n.nodeName) { parent.replaceChild(n, o); return; }
      if (o.nodeType === 3) { if (o.data !== n.data) o.data = n.data; return; }
      Array.from(o.attributes).forEach((a) => { if (!n.hasAttribute(a.name)) o.removeAttribute(a.name); });
      Array.from(n.attributes).forEach((a) => { if (o.getAttribute(a.name) !== a.value) o.setAttribute(a.name, a.value); });
      if (o.tagName === 'INPUT' && n.hasAttribute('value') && document.activeElement !== o) o.value = n.getAttribute('value');
      o.__h = n.__h;
      morph(o, Array.from(n.childNodes));
    });
    for (let i = next.length; i < old.length; i++) parent.removeChild(old[i]);
  }
  let inst, mount, tpl, queued = false;
  function render() { queued = false; morph(mount, build(Array.from(tpl.content.childNodes), inst.renderVals() || {}, [])); }
  function schedule() { if (!queued && mount) { queued = true; Promise.resolve().then(render); } }
  function dispatch(e) {
    let el = e.target;
    while (el && el !== mount) { const h = el.__h && el.__h[e.type]; if (h) { h(e); return; } el = el.parentNode; }
  }
  window.addEventListener('DOMContentLoaded', () => {
    tpl = document.getElementById('dc-tpl');
    mount = document.getElementById('dc-mount');
    inst = new window.Component({});
    window.__dc = inst;
    ['click', 'input'].forEach((t) => mount.addEventListener(t, dispatch));
    render();
    if (inst.componentDidMount) inst.componentDidMount();
  });
})();

</script>
<script>
class Component extends DCLogic {

}
window.Component = Component;
</script>
