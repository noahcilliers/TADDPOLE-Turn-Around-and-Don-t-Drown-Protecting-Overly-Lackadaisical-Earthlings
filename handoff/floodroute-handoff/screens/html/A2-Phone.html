<script>
class Component extends DCLogic {
constructor(...args) {
super(...args);

}
componentDidMount() {
this.timer = setInterval(() => {
const s = this.state;
if (!s.playing) return;
const tmax = s.mode === 'nav' ? 124 : 72;
const T = Math.min(tmax, s.T + 0.1 * s.speed);
this.setState({ T: T, playing: T < tmax });
}, 100);
