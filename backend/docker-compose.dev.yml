# Local development: a throwaway TimescaleDB standing in for Tiger Data.
services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_PASSWORD: password
    ports: ["5432:5432"]
    volumes:
      - ./scripts/local_schema.sql:/docker-entrypoint-initdb.d/001_local_schema.sql:ro
